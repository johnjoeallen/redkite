title: RedKite
description: Local Maven dependency analyser and upgrade assistant — documentation
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme

url: "https://johnjoeallen.github.io"
baseurl: "/redkite"

logo: null

search_enabled: true

aux_links:
  "RedKite on GitHub":
    - "https://github.com/johnjoeallen/redkite"
aux_links_new_tab: true

nav_sort: case_insensitive

heading_anchors: true

footer_content: "RedKite is open source, licensed under the Apache License 2.0."

back_to_top: true
back_to_top_text: "Back to top"

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
