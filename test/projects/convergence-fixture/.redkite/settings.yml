# RedKite build validation settings for this project — see:
# https://johnjoeallen.github.io/redkite/projects/build-validation/
#
# This fixture has no Spring Boot startup component and needs no extra Maven
# arguments, profile, or environment variables to build — mode and fullLogs
# are spelled out explicitly here as a worked example rather than left
# implicit, since this file also serves as a real, bundled sample of the
# format for anyone exploring the release zip. mode combines run (install
# goal) with test (don't skip tests) — see build-validation docs.

redkite:
  maven:
    mode: [run, test]
    fullLogs: true
