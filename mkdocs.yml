site_name: RedKite
site_description: Local Maven dependency analyser and update assistant for multi-module projects
site_url: https://johnjoeallen.github.io/redkite/
repo_url: https://github.com/johnjoeallen/redkite
repo_name: johnjoeallen/redkite
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md

  - Getting Started:
      - Overview: getting-started/index.md
      - Requirements: getting-started/requirements.md
      - Installation: getting-started/installation.md
